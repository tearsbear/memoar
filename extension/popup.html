<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memoar</title><link rel="stylesheet" href="popup.css"></head>
  <body><main>
    <header><img src="memoar-icon.png" width="38" height="38" alt=""><span class="brand">memoar</span><button id="library" class="text-button">Your library ↗</button></header>
    <div class="post-context"><p class="platform-heading"><img id="platform-icon" width="16" height="16" alt="" hidden><span id="platform">Checking this tab…</span></p><p id="page-url" class="url"></p></div>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="saving-state" class="saving-state" role="status" hidden><span class="saving-spinner" aria-hidden="true"></span><div><strong>Saving your post…</strong><p>Keep the post open. Your save comes first; organizing runs in the background.</p></div></section>
    <button id="capture" class="primary" disabled>Add to Memoar</button>
    <button id="open" class="primary" hidden>Open in Memoar</button>
    <p class="note">Saved on this browser profile. Muse Spark organizes your saved text and supported media in the background. Only save content you’re authorized to process.</p>
  </main><script src="popup.js"></script></body>
</html>
